# =============================================================================
# config.yaml
# Master configuration file for the Hybrid Automation Framework.
# This is the single source of truth for switching execution engines and
# controlling global framework behavior.
# =============================================================================

# ------------------------------------------------------------------------
# ENGINE SWITCH
# This single flag controls which Driver Factory implementation is used
# by core/driver_factory/driver_manager.py.
# Allowed values: "selenium" | "playwright"
# ------------------------------------------------------------------------
execution_engine: "selenium"

# ------------------------------------------------------------------------
# ACTIVE ENVIRONMENT
# Must match a key defined in environments.yaml
# ------------------------------------------------------------------------
active_environment: "qa"

# ------------------------------------------------------------------------
# BROWSER SETTINGS
# ------------------------------------------------------------------------
browser: "chrome"          # chrome | firefox | edge | webkit (playwright only)
headless: true
maximize_window: true
incognito: true
timeouts:
  implicit_wait: 5
  explicit_wait: 15
  page_load_timeout: 30
  script_timeout: 30
  poll_frequency: 0.5
retry:
  max_attempts: 3
  backoff_seconds: 2
  retry_on_exceptions:
  - TimeoutException
  - StaleElementReferenceException
  - ElementClickInterceptedException
  - TimeoutError
reporting:
  screenshot_on_failure: true
  screenshot_dir: screenshots
  report_dir: reports
  log_dir: logs
  log_level: INFO
  video_on_failure: false
  trace_on_failure: true
parallel:
  enabled: true
  workers: 4
remote:
  enabled: false
  hub_url: http://localhost:4444/wd/hub
