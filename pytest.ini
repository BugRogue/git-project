[pytest]
; =============================================================================
; pytest.ini
; Global pytest configuration for the Hybrid Automation Framework.
; =============================================================================

python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

testpaths =
    tests

; Custom markers - keep in sync with any @pytest.mark.* usage in tests/
markers =
    smoke: Quick, high-priority sanity checks
    regression: Full regression suite
    selenium: Tests intended for the Selenium engine
    playwright: Tests intended for the Playwright engine
    api: API-level tests (tests/api/)
    migration: Selenium-to-Playwright migration parity tests (tests/migration/)

; Console + HTML/JUnit reporting defaults (requires pytest-html, pytest-xdist)
addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml

; pytest-xdist: parallel workers (overridden at CLI with -n auto if desired)
; addopts above intentionally omits -n to keep default runs deterministic;
; add "-n auto" or "-n 4" on the command line for parallel execution.

log_cli = false
log_level = INFO
filterwarnings =
    ignore::DeprecationWarning
