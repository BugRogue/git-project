name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser binaries
        run: |
          playwright install --with-deps chromium firefox webkit

      - name: Install Selenium browser drivers
        run: |
          python -m pip install webdriver-manager

      - name: Run API tests
        run: |
          pytest tests/api -m api -v --junitxml=reports/junit-api.xml

      - name: Run Selenium smoke tests
        env:
          CI: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('config/config.yaml')
          data = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
          data['execution_engine'] = 'selenium'
          data['headless'] = True
          data['browser'] = 'chrome'
          path.write_text(yaml.safe_dump(data, sort_keys=False), encoding='utf-8')
          PY
          pytest tests/selenium -m selenium -v --junitxml=reports/junit-selenium.xml

      - name: Run Playwright smoke tests
        env:
          CI: true
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('config/config.yaml')
          data = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
          data['execution_engine'] = 'playwright'
          data['headless'] = True
          data['browser'] = 'chrome'
          path.write_text(yaml.safe_dump(data, sort_keys=False), encoding='utf-8')
          PY
          pytest tests/playwright -m playwright -v --junitxml=reports/junit-playwright.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: |
            reports/
            screenshots/
            logs/
