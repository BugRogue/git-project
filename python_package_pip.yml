name: Python Package using Pip
on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'   # caches pip downloads keyed on requirements.txt hash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats remaining issues as warnings only
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Selenium test suite
        run: |
          pytest tests/selenium -v
        env:
          EXECUTION_ENGINE: selenium

      - name: Run Playwright test suite
        run: |
          pytest tests/playwright -v
        env:
          EXECUTION_ENGINE: playwright

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            reports/
            screenshots/
          retention-days: 7
